<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
:root{--bg:#F2F4F9; --ink:#1A2032; --muted:#586179; --accent:#5638C9}
@media (prefers-color-scheme: dark){ :root{--bg:#0F121C; --ink:#E5E8F2; --muted:#9BA3B9; --accent:#A994FF} }
body{background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; padding:48px 16px}
main{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
h1{font-size:26px; margin:0} p{margin:0; color:var(--muted)} a{color:var(--accent); font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn't exist, or the guide moved.</p>
  <p><a id="home" href="/">Back to all games</a></p>
</main>
<script>
  // Project sites live under /<repo>/, so link to that folder rather than the domain root.
  const seg = location.pathname.split("/").filter(Boolean)[0];
  if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
</script>
</body>
</html>
